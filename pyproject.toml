[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpt-geometry-augmenter"
version = "0.1.0"
description = "Parametric + irregular metal geometries and a batch runner for MPT-Calculator"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Theerayut Boonkird" }]
requires-python = ">=3.10"

[tool.setuptools]
packages = ["mpt_aug"]

[tool.pytest.ini_options]
markers = ["slow: runs MPT-Calculator FEM (minutes); deselect with -m 'not slow'"]
testpaths = ["tests"]
